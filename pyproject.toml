[project]
name = "llm-trace-proxy"
version = "0.1.0"
description = "A zero-code, high-performance HTTP Gateway for tracking costs, latency, and tokens across commercial LLMs"
authors = [
    {name = "drowolath",email = "thomas@ayih-akakpo.org"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)"
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
